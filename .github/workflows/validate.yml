name: Validate Terraform reference

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.15.8"
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Initialize without backend
        run: terraform init -backend=false
      - name: Validate configuration
        run: terraform validate
      - name: Run mock-provider architecture tests
        run: terraform test
      - name: Evidence summary
        run: |
          echo "## OCX-ARCH-001" >> "$GITHUB_STEP_SUMMARY"
          echo "Terraform formatting, initialization and static validation passed." >> "$GITHUB_STEP_SUMMARY"
          echo "No AWS deployment or credentials are used by this workflow." >> "$GITHUB_STEP_SUMMARY"
