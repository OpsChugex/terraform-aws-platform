name: Validate Terraform reference

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: terraform-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.16.4"
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Initialize root without backend
        run: terraform init -backend=false -input=false
      - name: Validate root
        run: terraform validate
      - name: Initialize reference module
        run: terraform -chdir=modules/platform init -backend=false -input=false
      - name: Validate reference module
        run: terraform -chdir=modules/platform validate
      - name: Run mock-provider tests
        run: terraform -chdir=modules/platform test
